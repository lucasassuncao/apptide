CLITools:
  - name: "jq"
    source: winget
    id: "jqlang.jq"
    description: "Command-line JSON processor"
    info_url: "https://jqlang.github.io/jq/"
    action: install

  - name: "yq"
    source: winget
    id: "MikeFarah.yq"
    description: "Portable command-line YAML processor"
    info_url: "https://github.com/mikefarah/yq"
    action: install

  - name: "FFmpeg"
    source: winget
    id: "Gyan.FFmpeg"
    description: "Record, convert and stream audio and video"
    info_url: "https://www.gyan.dev/ffmpeg/"
    action: install

  - name: "Clink"
    source: winget
    id: "chrisant996.Clink"
    description: "Powerful readline editing for cmd.exe"
    info_url: "https://chrisant996.github.io/clink/"
    action: install

  - name: "fzf"
    source: winget
    id: "junegunn.fzf"
    description: "Command-line fuzzy finder"
    info_url: "https://github.com/junegunn/fzf"
    action: skip

  - name: "HTTPie"
    source: winget
    id: "HTTPie.HTTPie"
    description: "Command-line HTTP client"
    info_url: "https://httpie.io/"
    action: skip

  - name: "BusyBox"
    source: winget
    id: "frippery.busybox-w32"
    description: "Unix utilities in a single Windows executable"
    action: skip

  # ── Scoop ────────────────────────────────────

  - name: "ADB"
    source: scoop
    id: "adb"
    description: "Android SDK platform-tools (adb and fastboot)"
    action: install

  - name: "BBK CLI"
    source: scoop
    id: "bbk-cli"
    description: "Internet speed measurer"
    action: install

  - name: "Btop-LHM"
    source: scoop
    id: "btop-lhm"
    description: "Resource monitor with full hardware monitoring"
    action: install

  - name: "Ack"
    source: scoop
    id: "ack"
    description: "Grep optimized for programmers"
    action: install

  - name: "Vim"
    source: scoop
    id: "vim"
    description: "Highly configurable text editor"
    action: install

  - name: "Say"
    source: scoop
    id: "say"
    description: "macOS-like say command for Windows"
    action: install

  # ── Chocolatey ───────────────────────────────

  - name: "Choco Cleaner"
    source: chocolatey
    id: "choco-cleaner"
    description: "Clean up Chocolatey installation files"
    info_url: "https://github.com/bcurran3/ChocolateyPackages/tree/master/choco-cleaner"
    action: install

  - name: "Ctop"
    source: chocolatey
    id: "ctop"
    description: "Top-like interface for container metrics"
    info_url: "https://github.com/bcicen/ctop"
    action: install

  - name: "HTTPie (CLI)"
    source: chocolatey
    id: "httpie"
    description: "User-friendly HTTP client"
    info_url: "https://httpie.io/docs/cli"
    args: ["--ignore-dependencies"]
    action: install
