FileManagers:
  - name: "7-Zip"
    source: winget
    id: "7zip.7zip"
    description: "High-compression file archiver"
    info_url: "https://www.7-zip.org/"
    action: install

  - name: "Everything"
    source: winget
    id: "voidtools.Everything"
    description: "Ultra-fast file search for Windows"
    info_url: "https://www.voidtools.com/"
    action: install

  - name: "Superfile (spf)"
    source: winget
    id: "yorukot.superfile"
    description: "Modern terminal file manager"
    info_url: "https://superfile.dev/"
    action: install

  - name: "ReNamer"
    source: winget
    id: "den4b.ReNamer"
    description: "Powerful and flexible file renaming tool"
    info_url: "https://www.den4b.com/products/renamer"
    action: install

  - name: "TreeSize"
    source: winget
    id: "JAMSoftware.TreeSize"
    description: "Disk space usage analyzer"
    action: skip
