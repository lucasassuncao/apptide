Multimedia:
  - name: "VLC"
    source: winget
    id: "VideoLAN.VLC"
    description: "Free and open-source multimedia player"
    info_url: "https://www.videolan.org/vlc/"
    action: install

  - name: "Calibre"
    source: winget
    id: "calibre.calibre"
    description: "E-book manager and reader"
    info_url: "https://calibre-ebook.com/"
    action: install

  - name: "OBS Studio"
    source: winget
    id: "OBSProject.OBSStudio"
    description: "Video recording and live streaming"
    info_url: "https://obsproject.com/"
    action: install
    no_upgrade: true

  - name: "Ruffle"
    source: winget
    id: "Ruffle.Ruffle.Nightly"
    description: "Flash Player emulator written in Rust"
    info_url: "https://ruffle.rs/"
    action: install
    no_upgrade: true

  - name: "VidJuice UniTube"
    source: winget
    id: "VidJuice.UniTube"
    description: "Video downloader for multiple platforms"
    info_url: "https://www.vidjuice.com/unitube"
    action: install
    no_upgrade: true

  - name: "Spotify"
    source: winget
    id: "Spotify.Spotify"
    description: "Digital music streaming service"
    info_url: "https://www.spotify.com/"
    action: skip

  - name: "MPC-HC"
    source: winget
    id: "clsid2.mpc-hc"
    description: "Media Player Classic - Home Cinema"
    info_url: "https://github.com/clsid2/mpc-hc"
    action: skip

  - name: "Foxit Reader"
    source: winget
    id: "Foxit.FoxitReader"
    description: "Fast and lightweight PDF reader"
    info_url: "https://www.foxit.com/pdf-reader/"
    action: skip
